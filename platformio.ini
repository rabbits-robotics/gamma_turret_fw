; gamma_turret_fw: M5Stack Stamp-P4 (ESP32-P4) / ESP-IDF
; platform は公式 espressif32 が ESP32-P4 未対応のため、コミュニティ版 pioarduino を使う
; 55.03.312 = Arduino core 3.3.12 / ESP-IDF 5.5.5（2026-09-20）
; この platform は依存として pioarduino 版 PlatformIO Core 6.2.0 を penv に入れる（公式 Core 6.1.19 を置き換える）。
; platform と Core の版は対で使うこと（311 + Core 6.2.0 の組み合わせは SCons の版が衝突してビルドできない）

[platformio]
default_envs = stamp_p4
boards_dir = boards

[env:stamp_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-stamp-p4
framework = espidf
monitor_speed = 115200
build_flags =
    -std=gnu++17
